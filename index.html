<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Gourmet Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">
            <span class="logo-icon">🍽️</span>
            <span class="logo-text">Gourmet</span>
        </div>
        <nav>
            <button class="nav-btn" data-section="home">🏠 Home</button>
            <button class="nav-btn" data-section="food-categories">🍕 Food</button>
            <button class="nav-btn" data-section="drink-categories">🥤 Drinks</button>
        </nav>
        <div class="cart-icon" id="cartIcon">
            🛒
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>

        <!-- ===== SECTION: HOME ===== -->
        <section id="home" class="section active">
            <div class="hero">
                <h1>Welcome to Gourmet Restaurant</h1>
                <p>Discover our delicious food and refreshing drinks</p>
            </div>
            <div class="category-grid">
                <div class="category-card food-category" data-category="food">
                    <div class="category-icon">🍕</div>
                    <h2>Food</h2>
                    <p>Burgers • Pizza • Pasta</p>
                </div>
                <div class="category-card drink-category" data-category="drink">
                    <div class="category-icon">🥤</div>
                    <h2>Drinks</h2>
                    <p>Soft Drinks • Hot Drinks • Juices</p>
                </div>
            </div>
        </section>

        <!-- ===== SECTION: FOOD CATEGORIES ===== -->
        <section id="food-categories" class="section">
            <button class="back-btn" data-section="home">← Back to Home</button>
            <h2>🍕 Food Categories</h2>
            <div class="subcategory-grid" id="foodSubcategories">
                <!-- Generated by JavaScript -->
            </div>
        </section>

        <!-- ===== SECTION: DRINK CATEGORIES ===== -->
        <section id="drink-categories" class="section">
            <button class="back-btn" data-section="home">← Back to Home</button>
            <h2>🥤 Drink Categories</h2>
            <div class="subcategory-grid" id="drinkSubcategories">
                <!-- Generated by JavaScript -->
            </div>
        </section>

        <!-- ===== SECTION: ITEMS LIST ===== -->
        <section id="items-list" class="section">
            <button class="back-btn" data-section="home">← Back to Home</button>
            <h2 id="itemsListTitle">Items</h2>
            <div class="items-grid" id="itemsGrid">
                <!-- Generated by JavaScript -->
            </div>
        </section>

        <!-- ===== SECTION: DETAIL ===== -->
        <section id="detail" class="section">
            <button class="back-btn" id="detailBackBtn">← Back</button>
            <div class="detail-container" id="detailContainer">
                <!-- Generated by JavaScript -->
            </div>
        </section>

    </main>

    <!-- ===== CART MODAL ===== -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-modal">
            <div class="cart-header">
                <h2>🛒 Your Cart</h2>
                <button class="close-cart" id="closeCart">✕</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Generated by JavaScript -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
                <button class="clear-cart-btn" id="clearCart">Clear Cart</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div class="toast" id="toast"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
