<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order</title>
    <link rel="stylesheet" href="style.css">
    <script src="vendor/qrcode.min.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>
<body>
    <header>
        <div class="logo"><img class="logo-img logo-light" src="https://res.cloudinary.com/o4uwuwtd/image/upload/v1795632128/Gourmet-Logo-Light.svg" alt="Gourmet"><img class="logo-img logo-dark" src="https://res.cloudinary.com/o4uwuwtd/image/upload/v1795632130/Gourmet-Logo-Dark.svg" alt="Gourmet"><span class="visually-hidden" id="restaurantName">Gourmet</span></div>
        <div class="header-right">
            <div class="header-actions"><button class="theme-btn" id="themeBtn">🌙</button><button class="lang-btn" id="langBtn">عربي</button></div>
            <a class="back-link" href="menu.html" data-i18n="back"></a>
        </div>
    </header>

    <main class="container narrow">
        <h2 data-i18n="orderTitle"></h2>

        <div id="orderItems"></div>
        <div id="orderTotals"></div>

        <div class="qr-box" id="qrBox" style="display:none">
            <p data-i18n="qrNote"></p>
            <canvas id="qrCanvas"></canvas>
            <p class="qr-error" id="qrError"></p>
            <p class="ask-waiter" data-i18n="askWaiter"></p>
        </div>

        <button class="primary-btn pay-btn" id="payBtn" style="display:none" data-i18n="proceed"></button>
    </main>

    <!-- INVOICE POPUP (view only) -->
    <div class="overlay" id="invoiceOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="invoice"></h2>
                <button class="close-btn" id="closeInvoice">✕</button>
            </div>
            <div id="invoiceBody"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="i18n.js"></script>
    <script src="order.js"></script>
</body>
</html>
